name: Deploy Built by LT Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Built by LT
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.hostinger_host }}
          username: ${{ secrets.hostinger_username }}
          password: ${{ secrets.name_password }}
          port: ${{ secrets.hostinger_port }}
          # v1 has no exclude input, so list only deployable app files.
          source: "index.php,favicon.ico,lib.php,login.php,setup.php,api,app.js,app.css,.user.ini,lib,assets,uploads,.htaccess,storage,private-config.example.php,README.md,outbound"
          target: "domains/builtbylt.com/public_html"
          overwrite: true
          rm: false


